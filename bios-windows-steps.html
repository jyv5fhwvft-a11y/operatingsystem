<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS 301 · BIOS Windows · Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ================= CSS VARIABLES & RESET ================= */
:root{
  --bg:#06090f;--panel:rgba(255,255,255,.04);--stroke:rgba(255,255,255,.10);--stroke-2:rgba(255,255,255,.18);
  --ink:#eaf0fc;--ink-2:#c4cfe6;--muted:#8494b4;
  --blue:#5b8dff;--emerald:#2ee6a8;--amber:#ffb648;--crimson:#ff4d6d;--violet:#a06bff;
  --font:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow-x:hidden;min-height:100vh;padding-bottom:80px;line-height:1.6;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(900px 600px at 12% -8%,rgba(255,182,72,.10),transparent 62%),radial-gradient(800px 560px at 100% 108%,rgba(91,141,255,.10),transparent 60%);pointer-events:none;z-index:0;}

/* ================= NAVIGATION BAR ================= */
.nav{position:fixed;top:0;left:0;right:0;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(6,9,15,.85);border-bottom:1px solid var(--stroke);backdrop-filter:blur(18px);z-index:100;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;}
.nav-brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;}
.nav-dot{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px var(--amber);}
.nav-links{display:flex;gap:16px;}
.nav-link{color:var(--muted);text-decoration:none;transition:.2s;}
.nav-link:hover{color:#ffd18a;}

/* ================= MAIN LAYOUT ================= */
.container{position:relative;z-index:2;max-width:1200px;margin:0 auto;padding:120px 24px 40px;}
.page-header{text-align:center;margin-bottom:50px;}
.page-title{font-size:clamp(32px,4vw,48px);font-weight:900;letter-spacing:-.03em;margin-bottom:16px;background:linear-gradient(100deg,#fff,#ffd18a 60%,#ffb648);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.page-subtitle{font-size:16px;color:var(--ink-2);max-width:700px;margin:0 auto;}

/* ================= INTERACTIVE TIMELINE ================= */
.timeline-layout{display:grid;grid-template-columns:300px 1fr;gap:32px;align-items:start;}

/* Left Sidebar (Stages) */
.timeline-nav{display:flex;flex-direction:column;gap:8px;position:sticky;top:100px;}
.tl-btn{background:rgba(255,255,255,.02);border:1px solid var(--stroke);border-left:4px solid var(--muted);border-radius:8px;padding:14px 16px;text-align:left;cursor:pointer;transition:.3s;display:flex;flex-direction:column;gap:4px;}
.tl-btn:hover{background:rgba(255,255,255,.06);border-color:var(--stroke-2);border-left-color:var(--blue);}
.tl-btn.active{background:rgba(255,182,72,.1);border-color:var(--amber);border-left-color:var(--amber);transform:translateX(4px);box-shadow:0 4px 20px -5px rgba(255,182,72,.3);}
.tl-num{font-family:var(--mono);font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.1em;}
.tl-btn.active .tl-num{color:var(--amber);}
.tl-name{font-size:14px;font-weight:700;color:var(--ink-2);}
.tl-btn.active .tl-name{color:#fff;}

/* Right Panel (Content) */
.timeline-content{background:var(--panel);border:1px solid var(--stroke);border-radius:24px;padding:40px;min-height:500px;box-shadow:0 20px 40px -20px rgba(0,0,0,.8);position:relative;overflow:hidden;}
.tc-header{margin-bottom:24px;padding-bottom:20px;border-bottom:1px dashed rgba(255,255,255,.15);}
.tc-stage{font-family:var(--mono);font-size:12px;font-weight:800;color:var(--amber);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;}
.tc-title{font-size:24px;font-weight:900;color:#fff;line-height:1.2;}

.tc-section{margin-bottom:20px;}
.tc-label{font-family:var(--mono);font-size:11px;font-weight:900;color:var(--violet);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;display:block;}
.tc-text{font-size:15px;color:var(--ink-2);line-height:1.6;}
.tc-list{list-style:none;padding-left:0;margin-top:8px;}
.tc-list li{font-size:14px;color:var(--ink-2);margin-bottom:6px;padding-left:20px;position:relative;}
.tc-list li::before{content:'▹';position:absolute;left:0;color:var(--emerald);}
.tc-code{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:12px;font-family:var(--mono);font-size:13px;color:#88ffd8;margin-top:8px;}

/* Next Button */
.btn-next-stage{margin-top:30px;padding:12px 24px;background:var(--amber);color:#000;border:none;border-radius:8px;font-family:var(--font);font-size:14px;font-weight:900;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:8px;}
.btn-next-stage:hover{background:#ffc978;transform:translateY(-2px);}
.btn-next-stage:disabled{opacity:0.3;cursor:not-allowed;transform:none;}

@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeIn 0.3s ease; }

@media (max-width: 900px) {
  .timeline-layout { grid-template-columns: 1fr; }
  .timeline-nav { flex-direction: row; overflow-x: auto; padding-bottom: 10px; position: static; }
  .tl-btn { min-width: 150px; border-left: none; border-bottom: 4px solid var(--muted); }
  .tl-btn.active { transform: translateY(-4px); border-bottom-color: var(--amber); border-left-color: transparent; }
  .timeline-content { padding: 24px; }
}
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-brand">
    <span class="nav-dot"></span>
    <span>CS 301 · Boot Topics</span>
  </a>
  <div class="nav-links">
    <a href="bios-windows.html" class="nav-link">← Back to BIOS Windows</a>
  </div>
</nav>

<main class="container">

  <header class="page-header">
    <h1 class="page-title">The Boot Timeline</h1>
    <p class="page-subtitle">Click through the stages on the left to see exactly what the hardware and Windows OS are doing.</p>
  </header>

  <div class="timeline-layout">
    
    <!-- LEFT NAVIGATION -->
    <div class="timeline-nav" id="timelineNav">
      <button class="tl-btn active" data-stage="0"><span class="tl-num">STAGE 0</span><span class="tl-name">Power On</span></button>
      <button class="tl-btn" data-stage="1"><span class="tl-num">STAGE 1</span><span class="tl-name">POST & BIOS Init</span></button>
      <button class="tl-btn" data-stage="2"><span class="tl-num">STAGE 2</span><span class="tl-name">BIOS Extensions</span></button>
      <button class="tl-btn" data-stage="3"><span class="tl-num">STAGE 3</span><span class="tl-name">Data & Interrupts</span></button>
      <button class="tl-btn" data-stage="4"><span class="tl-num">STAGE 4</span><span class="tl-name">Boot Order</span></button>
      <button class="tl-btn" data-stage="5"><span class="tl-num">STAGE 5</span><span class="tl-name">MBR Loading</span></button>
      <button class="tl-btn" data-stage="6"><span class="tl-num">STAGE 6</span><span class="tl-name">Partition Scan</span></button>
      <button class="tl-btn" data-stage="7"><span class="tl-num">STAGE 7</span><span class="tl-name">VBR Execution</span></button>
      <button class="tl-btn" data-stage="8"><span class="tl-num">STAGE 8</span><span class="tl-name">Windows BOOTMGR</span></button>
      <button class="tl-btn" data-stage="9"><span class="tl-num">STAGE 9</span><span class="tl-name">Protected Mode</span></button>
      <button class="tl-btn" data-stage="10"><span class="tl-num">STAGE 10</span><span class="tl-name">Windows Startup</span></button>
    </div>

    <!-- RIGHT CONTENT PANEL -->
    <div class="timeline-content" id="timelineContent">
      <!-- Content injected via JS -->
    </div>

  </div>

</main>

<script>
/* ================= STAGE DATA ================= */
const stages = [
  {
    stage: "Stage 0",
    title: "Power On",
    what: "You press the power button.",
    actual: "Electricity flows to motherboard components. The CPU receives power but is 'frozen' (no instructions yet). RAM is empty and uninitialized.",
    code: null,
    passed: "Hardware is physically ready."
  },
  {
    stage: "Stage 1",
    title: "POST & BIOS Init",
    what: "Power-On Self Test (POST)",
    actual: [
      "CPU starts at hardwired address 0xFFFF0 pointing to BIOS ROM.",
      "CPU starts in 16-bit Real Mode.",
      "BIOS checks checksum and initializes chipset.",
      "Tests CPU, RAM (beep codes if faulty), Video, Keyboard."
    ],
    code: "CPU starts at 0xFFFF0\nFirst instruction: JMP F000:E05B\nBeep code: 1 short beep (success)",
    passed: "Working core hardware."
  },
  {
    stage: "Stage 2",
    title: "BIOS Extensions",
    what: "ROM Scan and Hardware Inventory",
    actual: [
      "Scans memory 0x0000 to 0xE0000 for extension ROMs.",
      "Initializes Video BIOS, SCSI controllers, Network boot ROMs.",
      "Discovers SATA, USB, and PCIe devices."
    ],
    code: "Video BIOS found at 0x0000\nSCSI ROM at 0x0000\nSATA Controller: 6 ports found",
    passed: "Enhanced hardware capabilities."
  },
  {
    stage: "Stage 3",
    title: "Data & Interrupts",
    what: "BIOS Data Area (BDA) & Interrupt Table",
    actual: [
      "Initializes BDA at 0x00400 to 0x00500.",
      "Stores equipment list, memory size, port addresses.",
      "Fills Interrupt Vector Table with service routines."
    ],
    code: "BDA at 0x00400\nINT 10h (Video) -> 0xF0045\nINT 13h (Disk) -> 0xE1000",
    passed: "Complete interrupt-based API."
  },
  {
    stage: "Stage 4",
    title: "Boot Order",
    what: "Select Boot Device",
    actual: [
      "BIOS reads boot sequence from CMOS RAM (via ports 0x70/0x71).",
      "Determines which device to try first (e.g., HDD, then CD-ROM).",
      "Attempts to read the first sector (512 bytes) of the selected device."
    ],
    code: "CMOS boot order:\n1st: Hard Disk\n2nd: CD-ROM\nTrying boot device 1: Hard Disk (80h)",
    passed: "Access to boot device."
  },
  {
    stage: "Stage 5",
    title: "MBR Loading",
    what: "Master Boot Record",
    actual: [
      "Reads 512 bytes from cylinder 0, head 0, sector 1.",
      "Loads this data into memory at 0x7C00.",
      "Verifies the boot signature (0x55 0xAA) at the end.",
      "CRITICAL: The MBR contains a 4-byte Disk Signature at offset 0x01B8 (used later by Windows)."
    ],
    code: "MBR loaded at 0x7C00\nBoot signature: 0x55 0xAA\nDisk Signature: 0x12345678",
    passed: "MBR in memory + Disk Identity."
  },
  {
    stage: "Stage 6",
    title: "Partition Scan",
    what: "Find the Active Partition",
    actual: [
      "MBR code scans the partition table at offset 0x01BE.",
      "Looks for the active (bootable) partition marked with 0x80.",
      "Loads the Volume Boot Record (VBR) of that partition into memory at 0x7C00 (overwriting the MBR)."
    ],
    code: "Active partition: Partition 1\nStart sector: LBA 2048\nVBR loaded at 0x7C00",
    passed: "Volume Boot Record ready."
  },
  {
    stage: "Stage 7",
    title: "VBR Execution",
    what: "Volume Boot Record",
    actual: [
      "Partition boot code takes over.",
      "It is filesystem-aware (e.g., NTFS).",
      "For Windows, it loads the larger Boot Manager (BOOTMGR) from the disk."
    ],
    code: "Filesystem: NTFS detected\nLoading BOOTMGR...\nPassing Disk Signature: 0x12345678",
    passed: "Full-featured bootloader."
  },
  {
    stage: "Stage 8",
    title: "Windows BOOTMGR",
    what: "Windows Boot Manager",
    actual: [
      "BOOTMGR validates the Disk Signature against the BCD (Boot Configuration Data).",
      "If mismatch, throws 'BOOTMGR is missing'.",
      "Loads winload.exe.",
      "Loads the Windows kernel (ntoskrnl.exe) and HAL (hal.dll)."
    ],
    code: "Current Disk Sig: 0x12345678\nBCD Stored Sig: 0x12345678 MATCH\nLoading ntoskrnl.exe",
    passed: "Verified OS selection + Windows Kernel."
  },
  {
    stage: "Stage 9",
    title: "Protected Mode",
    what: "Real to Protected Mode",
    actual: [
      "Bootloader disables interrupts.",
      "Sets up the Global Descriptor Table (GDT).",
      "Sets the protected mode bit in the CR0 register.",
      "Far jumps to 32-bit code. The kernel takes control of memory and processes."
    ],
    code: "CR0 register: Set bit 0 to 1\nCPU now in 32-bit protected mode\nKernel running at 0x80000000",
    passed: "Running Windows environment."
  },
  {
    stage: "Stage 10",
    title: "Windows Startup",
    what: "Services & Login",
    actual: [
      "Session Manager (smss.exe) starts.",
      "Windows services initialize (150+ services).",
      "Windows Logon (winlogon.exe) launches the login screen."
    ],
    code: "Services: 150+ starting\nWinlogon: Preparing login screen\nStatus: Ready for user interaction",
    passed: "Fully operational system."
  }
];

/* ================= RENDER LOGIC ================= */
const btns = document.querySelectorAll('.tl-btn');
const content = document.getElementById('timelineContent');

function renderStage(index) {
  const data = stages[index];
  
  let actualHtml = '';
  if (Array.isArray(data.actual)) {
    actualHtml = `<ul class="tc-list">${data.actual.map(item => `<li>${item}</li>`).join('')}</ul>`;
  } else {
    actualHtml = `<p class="tc-text">${data.actual}</p>`;
  }

  let codeHtml = '';
  if (data.code) {
    codeHtml = `<div class="tc-section"><span class="tc-label">Example Data</span><div class="tc-code">${data.code.replace(/\n/g, '<br>')}</div></div>`;
  }

  const isLast = index === stages.length - 1;
  const nextBtnHtml = `<button class="btn-next-stage" onclick="nextStage(${index})" ${isLast ? 'disabled' : ''}>Next Stage ➔</button>`;

  content.innerHTML = `
    <div class="fade-in">
      <div class="tc-header">
        <div class="tc-stage">${data.stage}</div>
        <div class="tc-title">${data.title}</div>
      </div>
      <div class="tc-section">
        <span class="tc-label">What Happens</span>
        <p class="tc-text">${data.what}</p>
      </div>
      <div class="tc-section">
        <span class="tc-label">What Actually Occurs</span>
        ${actualHtml}
      </div>
      ${codeHtml}
      <div class="tc-section" style="background:rgba(46,230,168,.05); padding:16px; border-radius:8px; border-left:3px solid var(--emerald);">
        <span class="tc-label" style="color:var(--emerald);">Information Passed to Next Step</span>
        <p class="tc-text" style="color:#fff; font-weight:600;">${data.passed}</p>
      </div>
      ${nextBtnHtml}
    </div>
  `;
}

/* ================= EVENT LISTENERS ================= */
btns.forEach((btn, index) => {
  btn.addEventListener('click', () => {
    // Update active button
    btns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    // Render content
    renderStage(index);
  });
});

function nextStage(currentIndex) {
  const nextIndex = currentIndex + 1;
  if (nextIndex < stages.length) {
    btns[nextIndex].click();
    // Scroll to top of content on mobile
    if (window.innerWidth <= 900) {
      window.scrollTo({ top: 200, behavior: 'smooth' });
    }
  }
}

// Initialize first stage
renderStage(0);
</script>

</body>
</html>
