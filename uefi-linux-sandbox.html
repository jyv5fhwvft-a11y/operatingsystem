<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS 301 · Linux UEFI · Sandbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ================= CSS VARIABLES & RESET ================= */
:root{
  --bg:#06090f;--panel:rgba(255,255,255,.04);--stroke:rgba(255,255,255,.10);--stroke-2:rgba(255,255,255,.18);
  --ink:#eaf0fc;--ink-2:#c4cfe6;--muted:#8494b4;
  --blue:#5b8dff;--emerald:#2ee6a8;--amber:#ffb648;--crimson:#ff4d6d;--violet:#a06bff;
  --font:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow-x:hidden;min-height:100vh;padding-bottom:80px;line-height:1.6; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(900px 600px at 12% -8%,rgba(46,230,168,.1),transparent 62%),radial-gradient(800px 560px at 100% 108%,rgba(255,182,72,.1),transparent 60%);pointer-events:none;z-index:0;}

/* ================= NAVIGATION BAR ================= */
.nav{position:fixed;top:0;left:0;right:0;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(6,9,15,.85);border-bottom:1px solid var(--stroke);backdrop-filter:blur(18px);z-index:100;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;}
.nav-brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;}
.nav-dot{width:8px;height:8px;border-radius:50%;background:var(--emerald);box-shadow:0 0 12px var(--emerald);}
.nav-links{display:flex;gap:16px;}
.nav-link{color:var(--muted);text-decoration:none;transition:.2s;}
.nav-link:hover{color:#88ffd8;}

/* ================= MAIN LAYOUT ================= */
.container{position:relative;z-index:2;max-width:900px;margin:0 auto;padding:120px 24px 40px;}
.page-header{text-align:center;margin-bottom:40px;}
.page-title{font-size:clamp(28px,4vw,42px);font-weight:900;letter-spacing:-.03em;margin-bottom:12px;background:linear-gradient(100deg,#fff,#88ffd8 60%,#2ee6a8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.page-subtitle{font-size:15px;color:var(--ink-2);max-width:700px;margin:0 auto;}

/* ================= SANDBOX UI ================= */
.sandbox-box{background:var(--panel);border:1px solid var(--stroke);border-radius:24px;padding:32px;margin-bottom:30px;box-shadow:0 20px 40px -20px rgba(0,0,0,.8);}

/* Control Panel */
.control-panel{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;}
.btn{padding:16px;border:none;border-radius:12px;font-family:var(--font);font-size:13px;font-weight:800;cursor:pointer;transition:.3s;text-align:center;line-height:1.4;}
.btn:hover{transform:translateY(-3px);}
.btn-normal{background:var(--emerald);color:#000;box-shadow:0 8px 20px -8px rgba(46,230,168,.8);}
.btn-secure{background:var(--crimson);color:#fff;box-shadow:0 8px 20px -8px rgba(255,77,109,.8);}
.btn-missing{background:var(--amber);color:#000;box-shadow:0 8px 20px -8px rgba(255,182,72,.8);}
.btn-kernel{background:var(--violet);color:#fff;box-shadow:0 8px 20px -8px rgba(160,107,255,.8);}

/* ================= TERMINAL OUTPUT ================= */
.terminal{background:#05080f;border:1px solid var(--stroke-2);border-radius:12px;padding:24px;font-family:var(--mono);font-size:13px;min-height:240px;display:flex;flex-direction:column;justify-content:flex-start;box-shadow:inset 0 0 20px rgba(0,0,0,.5);}
.term-line{display:block;margin-bottom:8px;line-height:1.6; white-space: pre-wrap;}
.t-error{color:var(--crimson);font-weight:800;}
.t-success{color:var(--emerald);font-weight:800;}
.t-info{color:var(--blue);}
.t-warn{color:var(--amber);}
.t-dim{color:var(--muted);}

/* Animations */
.shake{animation:shake 0.4s;}
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

@media (max-width: 700px) {
  .control-panel { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-brand">
    <span class="nav-dot"></span>
    <span>CS 301 · Feynman Lab</span>
  </a>
  <div class="nav-links">
    <a href="uefi-linux.html" class="nav-link">← Back to Linux UEFI</a>
  </div>
</nav>

<main class="container">

  <header class="page-header">
    <h1 class="page-title">The Linux UEFI Sandbox</h1>
    <p class="page-subtitle">Secure Boot makes Linux UEFI very strict. Break the system below and see the exact firmware and GRUB errors.</p>
  </header>

  <div class="sandbox-box">
    
    <div class="control-panel">
      <button class="btn btn-normal" onclick="runBoot('normal')">🟢 Normal UEFI Boot</button>
      <button class="btn btn-secure" onclick="runBoot('secure-boot')">🛡️ Secure Boot Violation (Tampered shim)</button>
      <button class="btn btn-missing" onclick="runBoot('missing-grub')">📂 Missing grubx64.efi</button>
      <button class="btn btn-kernel" onclick="runBoot('missing-kernel')">🐧 Missing vmlinuz (Kernel)</button>
    </div>

    <!-- TERMINAL OUTPUT -->
    <div class="terminal" id="terminal">
      <span class="term-line t-info">UEFI Firmware v2.8 initialized. Awaiting boot selection...</span>
      <span class="term-line t-dim">Press one of the scenario buttons above to initiate boot.</span>
    </div>
  </div>

</main>

<script>
/* ================= SANDBOX LOGIC ================= */
const terminal = document.getElementById('terminal');

function runBoot(type) {
  terminal.className = 'terminal';
  terminal.innerHTML = '';
  
  if (type === 'normal') {
    terminal.innerHTML = `
      <span class="term-line t-info">[UEFI] SEC Phase OK. PEI Phase OK. DXE Phase OK.</span>
      <span class="term-line t-info">[UEFI] Loading shim.efi from \\EFI\\ubuntu\\...</span>
      <span class="term-line t-warn">[Secure Boot] Signature verified (Microsoft UEFI CA).</span>
      <span class="term-line t-info">[shim.efi] Verifying grubx64.efi...</span>
      <span class="term-line t-warn">[Secure Boot] Signature verified (Canonical Ltd.).</span>
      <span class="term-line t-info">[GRUB] Reading /boot/grub/grub.cfg...</span>
      <span class="term-line t-info">[GRUB] Loading vmlinuz-5.15.0-91-generic...</span>
      <span class="term-line t-info">[GRUB] Loading initrd.img-5.15.0-91-generic...</span>
      <span class="term-line t-warn">[GRUB] Calling ExitBootServices()...</span>
      <span class="term-line t-success">[KERNEL] Decompressing Linux... done.</span>
      <span class="term-line t-success">[  OK  ] Started systemd.</span>
      <span class="term-line t-success">Welcome to Ubuntu 22.04.3 LTS</span>
    `;
  } 
  
  else if (type === 'secure-boot') {
    terminal.classList.add('shake');
    setTimeout(() => terminal.classList.remove('shake'), 500);
    
    terminal.innerHTML = `
      <span class="term-line t-info">[UEFI] SEC Phase OK. PEI Phase OK. DXE Phase OK.</span>
      <span class="term-line t-info">[UEFI] Loading shim.efi...</span>
      <span class="term-line t-error">[Security Violation] Verification failed: (0x1A)</span>
      <span class="term-line t-error">UEFI Secure Boot has blocked the execution of this image.</span>
      <span class="term-line t-dim">(The shim.efi file was tampered with, or its signature is not in the UEFI db.)</span>
      <span class="term-line t-error">System halted.</span>
    `;
  } 
  
  else if (type === 'missing-grub') {
    terminal.classList.add('shake');
    setTimeout(() => terminal.classList.remove('shake'), 500);
    
    terminal.innerHTML = `
      <span class="term-line t-info">[UEFI] Loading shim.efi... Verified.</span>
      <span class="term-line t-info">[shim.efi] Launching grubx64.efi...</span>
      <span class="term-line t-error">Failed to open \\EFI\\ubuntu\\grubx64.efi - Not Found</span>
      <span class="term-line t-error">Failed to load image \EFI\ubuntu\grubx64.efi: Not Found</span>
      <span class="term-line t-warn">Press any key to return to the UEFI Boot Menu...</span>
    `;
  } 
  
  else if (type === 'missing-kernel') {
    terminal.classList.add('shake');
    setTimeout(() => terminal.classList.remove('shake'), 500);
    
    terminal.innerHTML = `
      <span class="term-line t-info">[GRUB] Reading /boot/grub/grub.cfg...</span>
      <span class="term-line t-warn">[GRUB] Booting 'Ubuntu'...</span>
      <span class="term-line t-error">error: file '/boot/vmlinuz-5.15.0-91-generic' not found.</span>
      <span class="term-line t-error">error: you need to load the kernel first.</span>
      <span class="term-line t-dim">Press any key to continue...</span>
      <span class="term-line t-warn">grub> _</span>
      <span class="term-line t-dim">(You are dropped to the GRUB command line. You must manually locate the kernel or boot from a Live USB).</span>
    `;
  }
}
</script>

</body>
</html>
